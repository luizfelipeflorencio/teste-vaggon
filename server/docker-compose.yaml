version: '3.8'

services:
  db:
    image: mysql:8.0 # Ou use 'latest' para a versão mais recente
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha_root_secreta # Senha do usuário root
      MYSQL_DATABASE: meu_banco             # Cria este banco automaticamente
      MYSQL_USER: usuario_app               # Cria um usuário extra (opcional)
      MYSQL_PASSWORD: senha_usuario         # Senha do usuário extra
    ports:
      - "3306:3306" # Mapeia porta local:porta do container
    volumes:
      - mysql_data:/var/lib/mysql # Persistência dos dados

volumes:
  mysql_data: # Define o volume nomeado